# Render Blueprint — deploy the whole stack (web + PostgreSQL) in one click.
# Docs: https://render.com/docs/blueprint-spec
# Usage: push this file, then on Render → "New +" → "Blueprint" → pick this repo.
services:
  - type: web
    name: nthu-course-review
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn course_review.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: course-review-db
          property: connectionString

databases:
  - name: course-review-db
    plan: free
    databaseName: course_review_db
    user: course_review
